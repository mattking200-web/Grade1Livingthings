};
function activitiesFor(exp) {
  const list = ["learn"];
  if (exp.sortGame) list.push("sort");
  if (exp.matchGame) list.push("match");
  if (exp.tfGame) list.push("tf");
  list.push("quiz");
  return list;

/* =========================================================
   TIMER MANAGEMENT — prevents stale timers from breaking
   other screens when the user navigates away
   ========================================================= */
const Timers = {
  ids: [],
  later(fn, ms) {
    const id = setTimeout(() => {
      this.ids = this.ids.filter(x => x !== id);
      fn();
    }, ms);
    this.ids.push(id);
    return id;
  },
  clearAll() {
    this.ids.forEach(clearTimeout);
    this.ids = [];
  }
};

/* =========================================================
   PROGRESS TRACKING — bumped to v3 to fix stale scores
   ========================================================= */
const STORAGE_KEY = "lt_progress_v3";
let progress = {};
function loadProgress() {
  try {
    const v3 = localStorage.getItem(STORAGE_KEY);
    if (v3) { progress = JSON.parse(v3) || {}; return; }
    // Migrate v2 → v3 (old scores blocked new ones)
    const v2 = localStorage.getItem("lt_progress_v2");
    if (v2) {
      const o = JSON.parse(v2) || {};
      Object.keys(o).forEach(code => {
        progress[code] = {};
        const p = o[code];
        if (p.learn) progress[code].learn = p.learn;
        if (p.sort) progress[code].sort = p.sort;
        if (p.match) progress[code].match = p.match;
        if (p.tf) progress[code].tf = p.tf;
        if (p.quiz) progress[code].quiz = p.quiz;
      });
      saveProgress();
    }
  } catch (e) { progress = {}; }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
}
function recordResult(code, activity, result) {
  if (!progress[code]) progress[code] = {};
  const prev = progress[code][activity];
  if (prev) {
    if (result.done && prev.done) return;
    if (prev.total && result.total) {
      if ((prev.score / prev.total) >= (result.score / result.total)) return;
    }
  }
  progress[code][activity] = result;
  saveProgress();
}
function activityFraction(code, activity) {
  const r = (progress[code] || {})[activity];
  if (!r) return 0;
  if (r.done) return 1;
  if (r.total) return r.score / r.total;
  return 0;
}
function overallPercent(exp) {
  const acts = activitiesFor(exp);
  const sum = acts.reduce((s, a) => s + activityFraction(exp.code, a), 0);
  return Math.round((sum / acts.length) * 100);
}
function resetAllProgress() {
  if (!confirm("Erase all saved progress for every expectation?")) return;
  progress = {};
  saveProgress();
  renderMenu();
  speak("All progress has been reset.");
}

/* =========================================================
   SOUND EFFECTS — fixed AudioContext suspend bug
   ========================================================= */
const SFX = {
  enabled: true,
  ctx: null,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { console.warn('Web Audio not supported'); }
  },
  ensureResumed() {
    if (this.ctx && this.ctx.state === 'suspended') {
      try { this.ctx.resume(); } catch (e) {}
    }
  },
  playTone(freq, duration, type = 'sine', volume = 0.3) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    this.ensureResumed();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
    osc.start(this.ctx.currentTime);
    osc.stop(this.ctx.currentTime + duration);
  },
  correct() {
    if (!this.enabled) return;
    this.init();
    this.ensureResumed();
    this.playTone(523.25, 0.15, 'sine', 0.25);
    Timers.later(() => this.playTone(659.25, 0.2, 'sine', 0.25), 100);
  },
  wrong() {
    if (!this.enabled) return;
    this.init();
    this.ensureResumed();
    this.playTone(311.13, 0.3, 'sawtooth', 0.15);
  },
  success() {
    if (!this.enabled) return;
    this.init();
    this.ensureResumed();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      Timers.later(() => this.playTone(freq, 0.2, 'sine', 0.2), i * 120);
    });
  },
  click() {
    if (!this.enabled) return;
    this.init();
    this.ensureResumed();
    this.playTone(800, 0.05, 'square', 0.1);
  }
};
// Unlock audio on first user gesture (browser requirement)
document.addEventListener('pointerdown', () => SFX.init(), { once: true });

function toggleSFX() {
  SFX.enabled = !SFX.enabled;
  const btn = document.getElementById('sfxToggle');
  btn.setAttribute('aria-pressed', String(SFX.enabled));
  if (SFX.enabled) {
    btn.textContent = "🎵 Sounds: ON";
    btn.classList.remove('off');
    SFX.init();
    SFX.ensureResumed();
    SFX.click();
  } else {
    btn.textContent = "🔇 Sounds: OFF";
    btn.classList.add('off');
  }
}

/* =========================================================
   TEXT TO SPEECH — robust chunked engine with generation
   tokens to prevent stale callbacks from advancing the queue
   ========================================================= */
const TTS = {
  enabled: true,
  supported: ('speechSynthesis' in window),
  kind: null,
  priorityBusy: false,
  lockUntil: 0,
  hoverTimer: null,
  voice: null,
  queue: [],
  speaking: false,
  watchdog: null,
  nextTimer: null,
  gen: 0,

  clean(text) {
    if (!text) return "";
    let t = String(text);
    try { t = t.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{20E3}]/gu, " "); }
    catch (e) { t = t.replace(/[\u2190-\u2BFF\uD800-\uDFFF]/g, " "); }
    return t.replace(/\s+/g, " ").trim();
  },
  pickVoice() {
    if (!this.supported) return;
    const vs = speechSynthesis.getVoices() || [];
    this.voice = vs.find(v => /en[-_]CA/i.test(v.lang))
              || vs.find(v => /en[-_]US/i.test(v.lang))
              || vs.find(v => /^en/i.test(v.lang)) || null;
  },
  hardStop() {
    clearTimeout(this.hoverTimer);
    clearTimeout(this.watchdog);
    clearTimeout(this.nextTimer);
    this.queue = [];
    this.speaking = false;
    this.kind = null;
    this.priorityBusy = false;
    this.gen++;
    if (this.supported) { try { speechSynthesis.cancel(); } catch (e) {} }
  },
  blocked() { return this.priorityBusy || Date.now() < this.lockUntil; },

  // Split at sentence boundaries; only split long sentences further
  chunkText(text) {
    // Lookbehind-free split: match sentences with their trailing punctuation
    const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
    const chunks = [];
    for (const sentence of sentences) {
      const words = sentence.split(/\s+/).filter(w => w.length > 0);
      if (words.length <= 20) {
        chunks.push(words.join(' '));
      } else {
        // Split long sentences into ~15-word chunks at word boundaries
        let current = [];
        for (const word of words) {
          current.push(word);
          if (current.length >= 15) {
            chunks.push(current.join(' '));
            current = [];
          }
        }
        if (current.length > 0) chunks.push(current.join(' '));
      }
    }
    return chunks.length > 0 ? chunks : [text];
  },

  say(text, opts) {
    opts = opts || {};
    if (!this.enabled || !this.supported) return;
    const clean = this.clean(text);
    if (!clean) return;

    const isPriority = opts.priority !== false;
    this.hardStop();

    if (isPriority) {
      this.kind = 'priority';
      this.priorityBusy = true;
    } else {
      if (this.blocked()) return;
      this.kind = 'hover';
    }

    this.queue = this.chunkText(clean);
    this.gen++;
    this.processQueue(this.gen);
  },

  processQueue(myGen) {
    if (myGen !== this.gen) return; // stale call, ignore
    if (this.queue.length === 0) {
      this.speaking = false;
      if (this.kind === 'priority') {
        this.priorityBusy = false;
        this.lockUntil = Date.now() + 300;
      }
      this.kind = null;
      return;
    }

    this.speaking = true;
    const chunk = this.queue.shift();
    const u = new SpeechSynthesisUtterance(chunk);
    u.rate = 0.9;
    u.pitch = 1.05;
    u.lang = (this.voice && this.voice.lang) || 'en-CA';
    if (this.voice) u.voice = this.voice;

    // Watchdog: if chunk takes too long, force-advance
    clearTimeout(this.watchdog);
    const estimatedMs = Math.max(2500, chunk.length * 90);
    this.watchdog = Timers.later(() => {
      if (myGen !== this.gen) return;
      try { speechSynthesis.cancel(); } catch (e) {}
      this.processQueue(myGen);
    }, estimatedMs + 4000);

    const finish = () => {
      clearTimeout(this.watchdog);
      if (myGen !== this.gen) return;
      this.nextTimer = Timers.later(() => this.processQueue(myGen), 80);
    };
    u.onend = finish;
    u.onerror = finish;

    try { speechSynthesis.speak(u); }
    catch (e) {
      clearTimeout(this.watchdog);
      if (myGen !== this.gen) return;
      this.nextTimer = Timers.later(() => this.processQueue(myGen), 80);
    }
  },

  scheduleHover(text) {
    if (!this.enabled || !this.supported) return;
    clearTimeout(this.hoverTimer);
    if (this.blocked()) return;
    const clean = this.clean(text);
    if (!clean) return;
    this.hoverTimer = Timers.later(() => {
      if (this.blocked()) return;
      this.say(clean, { priority: false });
    }, 400);
  },
  cancelHover() {
    clearTimeout(this.hoverTimer);
    if (this.kind === 'hover') this.hardStop();
  }
};

if (TTS.supported) {
  TTS.pickVoice();
  speechSynthesis.onvoiceschanged = () => TTS.pickVoice();
}

function speak(text) { TTS.say(text); }

function toggleTTS() {
  TTS.enabled = !TTS.enabled;
  const btn = document.getElementById('ttsToggle');
  btn.setAttribute('aria-pressed', String(TTS.enabled));
  if (TTS.enabled) {
    btn.textContent = "🔊 Read Aloud: ON";
    btn.classList.remove('off');
    speak("Read aloud is on.");
  } else {
    TTS.hardStop();
    btn.textContent = "🔇 Read Aloud: OFF";
    btn.classList.add('off');
  }
}

function attachHoverSpeak(el, getText) {
  if (!el) return;
  const get = (typeof getText === "function") ? getText : () => getText;
  el.classList.add('hover-speaks');
  const start = () => TTS.scheduleHover(get());
  const end = () => TTS.cancelHover();
  el.addEventListener('pointerenter', e => {
    if (e.pointerType === 'mouse' || e.pointerType === 'pen') start();
  });
  el.addEventListener('pointerleave', end);
  el.addEventListener('focus', start);
  el.addEventListener('blur', end);
}

    const card = document.createElement('div');
    card.className = 'menu-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${exp.code} ${exp.title}. ${pct} percent complete.`);
    card.innerHTML = `
      <span class="emoji" aria-hidden="true">${exp.emoji}</span>
      <div class="code">${exp.code}</div>
      <div class="title">${exp.title}</div>
      <div class="desc">${exp.description}</div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      <div class="desc">${pct > 0 ? pct + '% complete' : 'Not started'}</div>
      <div class="badges">${badges}</div>`;
    card.onclick = () => { SFX.click(); openExpectation(exp.code); };
    card.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); SFX.click(); openExpectation(exp.code); }
    };
    attachHoverSpeak(card, `${exp.title}. ${exp.description}`);
    grid.appendChild(card);
  });
}

function goToMenu() {
  Timers.clearAll();
  TTS.hardStop();
  document.getElementById('menuScreen').classList.add('active');
  document.getElementById('activityScreen').classList.remove('active');
  renderMenu();
}

function openExpectation(code) {
  currentExpectation = expectations.find(e => e.code === code);
  currentTab = "learn";
  document.getElementById('menuScreen').classList.remove('active');
  document.getElementById('activityScreen').classList.add('active');
  document.getElementById('activityTitle').textContent =
    `${currentExpectation.emoji} ${currentExpectation.code}: ${currentExpectation.title}`;
  renderTabs();
  renderTab();
}

function renderTabs() {
  const tabs = document.getElementById('activityTabs');
  tabs.innerHTML = '';
  activitiesFor(currentExpectation).forEach(id => {
    const f = activityFraction(currentExpectation.code, id);
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (id === currentTab ? ' active' : '');
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', String(id === currentTab));
    btn.textContent = ACTIVITY_META[id].label + (f >= 0.8 ? ' ✓' : '');
    btn.onclick = () => { SFX.click(); currentTab = id; renderTabs(); renderTab(); };
    tabs.appendChild(btn);
  });
}

function renderTab() {
  Timers.clearAll();
  TTS.hardStop();
  const c = document.getElementById('activityContent');
  c.innerHTML = '';
  if (currentTab === "learn") renderLearn(c);
  else if (currentTab === "quiz") renderQuiz(c);
  else if (currentTab === "sort") renderSort(c);
  else if (currentTab === "match") renderMatch(c);
  else if (currentTab === "tf") renderTF(c);
}

/* =========================================================
   LEARN
   ========================================================= */
let learnIndex = 0;
function renderLearn(container) {
  if (!currentExpectation.vocab || !currentExpectation.vocab.length) {
    container.innerHTML = `<p style="text-align:center;font-size:1.2em;">Try another activity!</p>`;
    return;
  }
  learnIndex = 0;
  showLearnCard(container);
}
function showLearnCard(container) {
  const vocab = currentExpectation.vocab;
  const item = vocab[learnIndex];
  container.innerHTML = `
    <div class="learn-card" id="learnCard">
      <span class="big-emoji" aria-hidden="true">${item.emoji}</span>
      <h2>${item.word}</h2>
      <p>${item.def}</p>
      <button class="speak-btn" id="hearBtn">🔊 Hear It Again</button>
    </div>
    <div style="text-align:center;color:#666;">Card ${learnIndex + 1} of ${vocab.length}</div>
    <div class="nav-btns">
      <button class="nav-btn" id="prevBtn" ${learnIndex === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="nav-btn" id="nextBtn">${learnIndex === vocab.length - 1 ? '✓ Done' : 'Next →'}</button>
    </div>`;
  const text = `${item.word}. ${item.def}`;
  attachHoverSpeak(document.getElementById('learnCard'), text);
  document.getElementById('hearBtn').onclick = () => { SFX.click(); speak(text); };
  document.getElementById('prevBtn').onclick = () => {
    if (learnIndex > 0) { SFX.click(); learnIndex--; showLearnCard(container); }
  };
  document.getElementById('nextBtn').onclick = () => {
    SFX.click();
    if (learnIndex < vocab.length - 1) { learnIndex++; showLearnCard(container); return; }
    recordResult(currentExpectation.code, "learn", { done: true });
    SFX.success();
    speak("Great job! You finished learning. Now try an activity!");
    Timers.later(goToMenu, 1600);
  };
  speak(text);
}

/* =========================================================
   QUIZ — child controls pace on wrong answers
   ========================================================= */
let quizIndex = 0, quizScore = 0, quizAnswered = false;
function renderQuiz(container) {
  quizIndex = 0;
  quizScore = 0;
  showQuizQuestion(container);
}
function showQuizQuestion(container) {
  const qs = currentExpectation.quiz;
  if (quizIndex >= qs.length) {
    recordResult(currentExpectation.code, "quiz", { score: quizScore, total: qs.length });
    const pct = Math.round((quizScore / qs.length) * 100);
    const msg = pct === 100 ? "Perfect! You're a science superstar!"
              : pct >= 70 ? "Great job! You know your stuff!"
              : pct >= 50 ? "Good try! Let's learn a bit more!"
              : "Keep practicing! You'll get it!";
    container.innerHTML = `
      <div class="score-box">
        <h2>Quiz Complete!</h2>
        <div class="score-num">${quizScore} / ${qs.length}</div>
        <div style="font-size:1.2em;">${msg}</div>
        <button class="nav-btn" style="margin-top:20px;" onclick="renderTab()">🔁 Try Again</button>
        <button class="nav-btn" style="margin-top:10px;background:#118ab2;" onclick="goToMenu()">🏠 Menu</button>
      </div>`;
    if (pct === 100) SFX.success();
    speak(`You got ${quizScore} out of ${qs.length}. ${msg}`);
    renderTabs();
    return;
  }
  quizAnswered = false;
  const q = qs[quizIndex];
  container.innerHTML = `
    <div class="quiz-question">
      <span class="q-emoji" aria-hidden="true">${q.emoji}</span>
      <div>${q.q}</div>
      <div class="q-count">Question ${quizIndex + 1} of ${qs.length}</div>
    </div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite" style="display:none;"></div>`;
  const opts = document.getElementById('quizOptions');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'quiz-option';
    btn.textContent = opt;
    btn.tabIndex = 0;
    btn.setAttribute('role', 'button');
    btn.onclick = () => handleQuizAnswer(i, q.answer, container, btn);
    btn.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleQuizAnswer(i, q.answer, container, btn); }
    };
    attachHoverSpeak(btn, () => quizAnswered ? "" : opt);
    opts.appendChild(btn);
  });
  speak(q.q);
}
function handleQuizAnswer(chosen, correct, container) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = currentExpectation.quiz[quizIndex];
  document.querySelectorAll('.quiz-option').forEach((o, i) => {
    o.onclick = null;
    o.onkeydown = null;
    o.tabIndex = -1;
    o.classList.add('locked');
    if (i === correct) o.classList.add('correct');
    else if (i === chosen) o.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  const right = chosen === correct;

  if (right) {
    quizScore++;
    SFX.correct();
    fb.className = 'feedback good';
    fb.innerHTML = `<span class="fb-title">✅ Correct! Great job!</span>`;
    speak("Correct! Great job!");
    // Auto-advance after 1.5s for correct answers
    Timers.later(() => { quizIndex++; showQuizQuestion(container); }, 1500);
  } else {
    SFX.wrong();
    fb.className = 'feedback bad';
    const explain = q.feedback || "Let's keep learning!";
    const safeExplain = explain.replace(/'/g, "\\'");
    const safeAnswer = q.options[correct].replace(/'/g, "\\'");
    fb.innerHTML = `
      <span class="fb-title">❌ Not quite!</span>
      <span class="fb-explain">The correct answer is <strong>${q.options[correct]}</strong>.<br>${explain}</span>
      <div class="fb-actions">
        <button class="speak-btn" id="replayBtn">🔊 Hear It Again</button>
        <button class="nav-btn" id="nextQBtn">Next Question →</button>
      </div>`;
    document.getElementById('replayBtn').onclick = () =>
      speak(`The correct answer is ${q.options[correct]}. ${explain}`);
    document.getElementById('nextQBtn').onclick = () => {
      quizIndex++;
      showQuizQuestion(container);
    };
    speak(`Not quite. The correct answer is ${q.options[correct]}. ${explain}`);
    // NO auto-advance — child controls pace
  }
}

/* =========================================================
   SORT GAME — fixed tap-to-reselect bug on touch
   ========================================================= */
let sortChecked = false, selectedSortItem = null;
function binLabel(bin) {
  return { living: "Living", "non-living": "Non-Living", plant: "Plants", animal: "Animals", both: "Both", tray: "the card tray" }[bin] || bin;
}
function binHeading(bin) {
  return { living: "🌱 Living", "non-living": "🪨 Non-Living", plant: "🌻 Plants", animal: "🐾 Animals", both: "💧 Both" }[bin] || bin;
}
function renderSort(container) {
  const game = currentExpectation.sortGame;
  if (!game) return;
  sortChecked = false;
  selectedSortItem = null;
  const bins = game.bins || ["living", "non-living"];
  container.innerHTML = `
    <div class="sort-instruction">👆 Tap a card, then tap a group. Or drag it!</div>
    <div class="items-to-sort" id="itemsToSort" data-bin="tray"></div>
    <div class="sort-bins bins-${bins.length}" id="sortBins"></div>
    <div class="feedback" id="sortFeedback" role="status" aria-live="polite" style="display:none;"></div>
    <div style="text-align:center;margin-top:15px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="nav-btn" id="checkSortBtn">✓ Check My Work</button>
      <button class="nav-btn" style="background:#118ab2;" onclick="renderTab()">🔁 Reset</button>
    </div>`;
  const tray = document.getElementById('itemsToSort');
  [...game.items].sort(() => Math.random() - 0.5).forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'sort-item';
    el.textContent = item.name;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', TTS.clean(item.name) + ". Tap to pick up, then choose a group.");
    el.dataset.correct = game.bins ? item.living : (item.living ? "living" : "non-living");
    el.dataset.idx = i;
    makeSortItemInteractive(el);
    attachHoverSpeak(el, () => sortChecked ? "" : item.name);
    tray.appendChild(el);
  });
  const binsDiv = document.getElementById('sortBins');
  bins.forEach(bin => {
    const binEl = document.createElement('div');
    binEl.className = 'sort-bin';
    binEl.dataset.bin = bin;
    binEl.tabIndex = 0;
    binEl.setAttribute('role', 'button');
    binEl.setAttribute('aria-label', binLabel(bin) + " group");
    binEl.innerHTML = `<h3>${binHeading(bin)}</h3><div class="bin-items"></div>`;
    binEl.onclick = (e) => {
      if (sortChecked) return;
      // Don't auto-place if the click landed on a sort-item (it handles itself)
      if (e.target.closest('.sort-item')) return;
      if (selectedSortItem) { SFX.click(); placeItem(selectedSortItem, binEl); }
      else speak(binLabel(bin) + " group. Pick a card first.");
    };
    binEl.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); binEl.click(); }
    };
    attachHoverSpeak(binEl, () => selectedSortItem ? `Put it in ${binLabel(bin)}` : binLabel(bin) + " group");
    binsDiv.appendChild(binEl);
  });
  tray.onclick = e => {
    if (e.target === tray && selectedSortItem) { SFX.click(); placeItem(selectedSortItem, tray); }
  };
  document.getElementById('checkSortBtn').onclick = () => { SFX.click(); checkSort(); };
  speak("Tap a card, then tap a group. You can also drag the cards.");
}
function makeSortItemInteractive(el) {
  let startX = 0, startY = 0, dragging = false, ghost = null, activeId = null;
  const cleanup = () => {
    if (ghost) { ghost.remove(); ghost = null; }
    el.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(b => b.classList.remove('drag-over'));
    dragging = false;
    activeId = null;
  };
  const targetAt = (x, y) => {
    const t = document.elementFromPoint(x, y);
    return t ? t.closest('[data-bin]') : null;
  };
  el.addEventListener('pointerdown', e => {
    if (sortChecked) return;
    activeId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    dragging = false;
    try { el.setPointerCapture(activeId); } catch (err) {}
  });
  el.addEventListener('pointermove', e => {
    if (activeId === null || e.pointerId !== activeId || sortChecked) return;
    if (!dragging && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) {
      dragging = true;
      TTS.cancelHover();
      clearSelection();
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.textContent = el.textContent;
      document.body.appendChild(ghost);
      el.classList.add('dragging');
    }
    if (dragging) {
      e.preventDefault();
      ghost.style.left = e.clientX + 'px';
      ghost.style.top = e.clientY + 'px';
      document.querySelectorAll('.drag-over').forEach(b => b.classList.remove('drag-over'));
      const t = targetAt(e.clientX, e.clientY);
      if (t) t.classList.add('drag-over');
    }
  });
  el.addEventListener('pointerup', e => {
    if (activeId === null || e.pointerId !== activeId) return;
    try { el.releasePointerCapture(activeId); } catch (err) {}
    if (dragging) {
      const t = targetAt(e.clientX, e.clientY);
      cleanup();
      if (t) { SFX.click(); placeItem(el, t); }
    } else {
      cleanup();
      SFX.click();
      toggleSelect(el);
    }
    // Prevent the synthesized click from bubbling to binEl.onclick
    e.stopPropagation();
  });
  el.addEventListener('pointercancel', cleanup);
  el.addEventListener('keydown', e => {
    if (sortChecked) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); SFX.click(); toggleSelect(el); }
    if (e.key === 'Escape') clearSelection();
  });
}
function clearSelection() {
  if (selectedSortItem) selectedSortItem.classList.remove('selected');
  selectedSortItem = null;
  document.querySelectorAll('.sort-bin').forEach(b => b.classList.remove('armed'));
}
function toggleSelect(el) {
  if (selectedSortItem === el) { clearSelection(); speak("Put down."); return; }
  clearSelection();
  selectedSortItem = el;
  el.classList.add('selected');
  document.querySelectorAll('.sort-bin').forEach(b => b.classList.add('armed'));
  speak(`${TTS.clean(el.textContent)} picked up. Now tap a group.`);
}
function placeItem(el, binEl) {
  const holder = binEl.dataset.bin === "tray" ? binEl : binEl.querySelector('.bin-items');
  if (!holder) return;
  holder.appendChild(el);
  clearSelection();
  el.focus({ preventScroll: true });
  speak(`${TTS.clean(el.textContent)} goes in ${binLabel(binEl.dataset.bin)}.`);
}
function checkSort() {
  if (sortChecked) return;
  clearSelection();
  const game = currentExpectation.sortGame;
  const total = game.items.length;
  let correct = 0, unsorted = 0;
  document.querySelectorAll('.sort-item').forEach(item => {
    const holder = item.closest('[data-bin]');
    const where = holder ? holder.dataset.bin : "tray";
    if (where === "tray") {
      unsorted++;
    } else if (where === item.dataset.correct) {
      correct++;
    }
    const chip = document.createElement('div');
    let chipClass = 'bin-item';
    if (where === "tray") chipClass += ' unsorted';
    else if (where !== item.dataset.correct) chipClass += ' wrong';
    chip.className = chipClass;
    chip.textContent = item.textContent;
    item.replaceWith(chip);
  });
  sortChecked = true;
  recordResult(currentExpectation.code, "sort", { score: correct, total });
  renderTabs();
  const fb = document.getElementById('sortFeedback');
  fb.style.display = 'block';
  let msg;
  if (correct === total) {
    fb.className = 'feedback good';
    msg = `🎉 Perfect! All ${total} cards are in the right group!`;
    SFX.success();
  } else {
    fb.className = 'feedback bad';
    msg = `You got ${correct} out of ${total}.`;
    if (unsorted) msg += ` ${unsorted} card${unsorted > 1 ? 's were' : ' was'} left in the tray.`;
    if (correct < total - unsorted) msg += ` Yellow cards are not sorted. Red cards are in the wrong group. Tap Reset to try again!`;
    else msg += ` Tap Reset to try again!`;
    SFX.wrong();
  }
  fb.textContent = msg;
  speak(msg);
}

/* =========================================================
   MATCH GAME
   ========================================================= */
let matchCards = [], matchFlipped = [], matchMatched = 0, matchBusy = false;
function renderMatch(container) {
  const pairs = currentExpectation.matchGame;
  if (!pairs) return;
  matchCards = [];
  matchFlipped = [];
  matchMatched = 0;
  matchBusy = false;
  pairs.forEach((p, i) => {
    matchCards.push({ id: i, display: p.a });
    matchCards.push({ id: i, display: p.b });
  });
  matchCards.sort(() => Math.random() - 0.5);
  container.innerHTML = `
    <div class="sort-instruction">🔗 Find the matching pairs! Tap two cards.</div>
    <div class="match-grid" id="matchGrid"></div>
    <div class="feedback" id="matchFeedback" role="status" aria-live="polite" style="display:none;"></div>`;
  const grid = document.getElementById('matchGrid');
  matchCards.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.textContent = '?';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', 'Hidden card');
    card.onclick = () => { SFX.click(); flipCard(card, i); };
    card.onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); SFX.click(); flipCard(card, i); }
    };
    attachHoverSpeak(card, () =>
      (card.classList.contains('flipped') || card.classList.contains('matched')) ? c.display : "");
    grid.appendChild(card);
  });
  speak("Find the matching pairs. Tap two cards.");
}
function flipCard(cardEl, idx) {
  if (matchBusy) return;
  if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
  cardEl.classList.add('flipped');
  cardEl.textContent = matchCards[idx].display;
  cardEl.setAttribute('aria-label', TTS.clean(matchCards[idx].display));
  speak(matchCards[idx].display);
  matchFlipped.push({ el: cardEl, idx, id: matchCards[idx].id });
  if (matchFlipped.length < 2) return;
  matchBusy = true;
  const [a, b] = matchFlipped;
  const isMatch = a.id === b.id && a.idx !== b.idx;
  Timers.later(() => {
    if (isMatch) {
      a.el.classList.add('matched');
      b.el.classList.add('matched');
      SFX.correct();
      matchMatched++;
      if (matchMatched === currentExpectation.matchGame.length) {
        recordResult(currentExpectation.code, "match", { done: true });
        renderTabs();
        const fb = document.getElementById('matchFeedback');
        fb.style.display = 'block';
        fb.className = 'feedback good';
        fb.textContent = "🎉 You matched them all!";
        SFX.success();
        speak("You matched them all! Great job!");
      }
    } else {
      SFX.wrong();
      [a, b].forEach(x => {
        x.el.classList.remove('flipped');
        x.el.textContent = '?';
        x.el.setAttribute('aria-label', 'Hidden card');
      });
    }
    matchFlipped = [];
    matchBusy = false;
  }, isMatch ? 700 : 1200);
}

/* =========================================================
   TRUE / FALSE
   ========================================================= */
let tfIndex = 0, tfScore = 0, tfAnswered = false;
function renderTF(container) {
  tfIndex = 0;
  tfScore = 0;
  showTFQuestion(container);
}
function showTFQuestion(container) {
  const game = currentExpectation.tfGame;
  if (tfIndex >= game.length) {
    recordResult(currentExpectation.code, "tf", { score: tfScore, total: game.length });
    renderTabs();
    container.innerHTML = `
      <div class="score-box">
        <h2>True or False Done!</h2>
        <div class="score-num">${tfScore} / ${game.length}</div>
        <button class="nav-btn" style="margin-top:20px;" onclick="renderTab()">🔁 Try Again</button>
        <button class="nav-btn" style="margin-top:10px;background:#118ab2;" onclick="goToMenu()">🏠 Menu</button>
      </div>`;
    const pct = Math.round((tfScore / game.length) * 100);
    if (pct === 100) SFX.success();
    speak(`You got ${tfScore} out of ${game.length}.`);
    return;
  }
  tfAnswered = false;
  const q = game[tfIndex];
  container.innerHTML = `
    <div class="quiz-question">
      <span class="q-emoji" aria-hidden="true">${q.emoji}</span>
      <div>${q.statement}</div>
      <div class="q-count">Question ${tfIndex + 1} of ${game.length}</div>
    </div>
    <div class="tf-buttons">
      <button class="tf-btn tf-true" id="tfTrue">✅ True</button>
      <button class="tf-btn tf-false" id="tfFalse">❌ False</button>
    </div>
    <div class="feedback" id="tfFeedback" role="status" aria-live="polite" style="display:none;"></div>`;
  const t = document.getElementById('tfTrue'), f = document.getElementById('tfFalse');
  t.onclick = () => { SFX.click(); handleTF(true); };
  f.onclick = () => { SFX.click(); handleTF(false); };
  attachHoverSpeak(t, () => tfAnswered ? "" : "True");
  attachHoverSpeak(f, () => tfAnswered ? "" : "False");
  speak(q.statement + " True or false?");
}
function handleTF(answer) {
  if (tfAnswered) return;
  tfAnswered = true;
  const q = currentExpectation.tfGame[tfIndex];
  document.querySelectorAll('.tf-btn').forEach(b => { b.onclick = null; b.disabled = true; });
  const right = answer === q.answer;
  if (right) {
    tfScore++;
    SFX.correct();
    const fb = document.getElementById('tfFeedback');
    fb.style.display = 'block';
    fb.className = 'feedback good';
    fb.textContent = "✅ Correct!";
    speak("Correct!");
  } else {
    SFX.wrong();
    const fb = document.getElementById('tfFeedback');
    fb.style.display = 'block';
    fb.className = 'feedback bad';
    fb.textContent = `❌ The answer was ${q.answer ? 'True' : 'False'}.`;
    speak(`The answer was ${q.answer ? 'True' : 'False'}.`);
  }
  Timers.later(() => {
    tfIndex++;
    showTFQuestion(document.getElementById('activityContent'));
  }, 2200);
}
